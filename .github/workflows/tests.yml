name: Tests

# Lua syntax check and the mocked-WoW scenario tests, on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          npm install --prefix tests
          pip install lupa

      - name: Lua syntax check
        run: node tests/syntax_check.js .

      - name: Scenario tests
        run: python tests/run.py
